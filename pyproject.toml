[project]
name = "compliance-sentinel"
version = "0.1.0"
description = "LangGraph agent that audits a codebase against new regulations and produces audit-ready PDF reports"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "pgvector>=0.3",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "trafilatura>=2.0",
  "pymupdf>=1.25",
  "playwright>=1.49",
  "bullmq>=2.11",
  "redis>=5.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "weasyprint>=63",
  "clerk-backend-api>=1.5",
  "svix>=1.40",
  "voyageai>=0.3",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.6",
  "pyyaml>=6.0",
  "typer>=0.15",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "respx>=0.21"]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["demo-target-repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "I001", "UP035"]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: needs Postgres with pgvector (docker compose up -d)"]
