name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel_test
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379/0
      LLM_MODE: offline
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Offline evaluation on the golden set
        run: |
          uv run sentinel db-upgrade
          uv run sentinel seed
          uv run sentinel scrape -s fixtures
          uv run sentinel audit --approve-as "CI"
          uv run sentinel eval --out evals/results-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results-ci.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
